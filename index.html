<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#1E2433; --muted:#5E6679; --line:#DFE4EE; --dot:#D3DAE8;
  --orange:#E9622F; --orange-s:#FFECE3;
  --teal:#0C9A89; --teal-s:#DCF4F0;
  --violet:#6F53D6; --violet-s:#EEEAFD;
  --amber:#C98500; --amber-s:#FFF2D2;
  --green:#3A9436; --green-s:#E4F4E2;
  --blue:#2C74D6; --blue-s:#E2EDFC;
  --pink:#D23F75; --pink-s:#FCE5EE;
  --marker:#FFE066; --danger:#C62828; --on:#FFFFFF;
  --accent:var(--blue); --accent-s:var(--blue-s);
  --b1:rgba(255,130,80,.44); --b2:rgba(20,190,170,.38); --b3:rgba(130,100,240,.40); --b4:rgba(60,140,240,.38); --b5:rgba(240,90,150,.34);
  --glass:rgba(255,255,255,.78);
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151E; --surface:#1B202C; --ink:#E9ECF3; --muted:#A0A8BA; --line:#2C3445; --dot:#232A39;
    --orange:#FF8A5C; --orange-s:rgba(255,138,92,.16);
    --teal:#3DD0BD; --teal-s:rgba(61,208,189,.15);
    --violet:#A88FFF; --violet-s:rgba(168,143,255,.17);
    --amber:#F5B83D; --amber-s:rgba(245,184,61,.15);
    --green:#7BD274; --green-s:rgba(123,210,116,.15);
    --blue:#6FA8FF; --blue-s:rgba(111,168,255,.16);
    --pink:#FF7AA8; --pink-s:rgba(255,122,168,.16);
    --marker:rgba(255,214,80,.38); --danger:#FF8A80; --on:#10131B;
    --b1:rgba(255,120,70,.20); --b2:rgba(40,200,180,.16); --b3:rgba(140,110,255,.20); --b4:rgba(80,150,255,.18); --b5:rgba(255,90,150,.16);
    --glass:rgba(27,32,44,.80);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151E; --surface:#1B202C; --ink:#E9ECF3; --muted:#A0A8BA; --line:#2C3445; --dot:#232A39;
  --orange:#FF8A5C; --orange-s:rgba(255,138,92,.16); --teal:#3DD0BD; --teal-s:rgba(61,208,189,.15);
  --violet:#A88FFF; --violet-s:rgba(168,143,255,.17); --amber:#F5B83D; --amber-s:rgba(245,184,61,.15);
  --green:#7BD274; --green-s:rgba(123,210,116,.15); --blue:#6FA8FF; --blue-s:rgba(111,168,255,.16);
  --pink:#FF7AA8; --pink-s:rgba(255,122,168,.16); --marker:rgba(255,214,80,.38); --danger:#FF8A80; --on:#10131B;
  --b1:rgba(255,120,70,.20); --b2:rgba(40,200,180,.16); --b3:rgba(140,110,255,.20); --b4:rgba(80,150,255,.18); --b5:rgba(255,90,150,.16);
  --glass:rgba(27,32,44,.80);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--gothic); color:var(--ink); background-color:var(--bg);
  line-height:1.75; font-size:16px; padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 5色のにじみ(案A) */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(42vmax 42vmax at 0% 0%, var(--b1), transparent 70%),
  radial-gradient(38vmax 38vmax at 100% 8%, var(--b2), transparent 70%),
  radial-gradient(46vmax 46vmax at 100% 100%, var(--b3), transparent 70%),
  radial-gradient(40vmax 40vmax at 0% 100%, var(--b4), transparent 70%),
  radial-gradient(30vmax 30vmax at 55% 55%, var(--b5), transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--round);line-height:1.4;margin:0;font-weight:700}
h1{font-size:1.7rem;display:flex;align-items:center;gap:.6rem;margin-bottom:.2rem}
h2{font-size:1.15rem}
.lead{color:var(--muted);margin:.3rem 0 1.5rem}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 .6rem}
.badge{display:inline-grid;place-items:center;min-width:2.1rem;height:2.1rem;border-radius:50%;background:var(--accent);color:var(--on);font-size:1rem}

/* ===== header ===== */
.bar{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + .55rem) 1rem .55rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-family:var(--round);font-weight:700;font-size:1.08rem;background:none;border:0;padding:0;cursor:pointer}
.logo{display:inline-flex;gap:3px}
.logo i{width:9px;height:9px;border-radius:50%;display:block}
.logo i:nth-child(1){background:var(--orange)} .logo i:nth-child(2){background:var(--teal)} .logo i:nth-child(3){background:var(--violet)}
.logo i:nth-child(4){background:var(--blue)} .logo i:nth-child(5){background:var(--pink)}
.bar .spacer{flex:1}
.tagline{font-family:var(--gothic);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:.3rem}
@media (max-width:720px){.tagline{display:none}}
.bar .who{color:var(--muted);font-size:.88rem}
.navbtn{border:0;background:none;padding:.4rem .7rem;border-radius:999px;cursor:pointer;font-weight:500}
.navbtn:hover,.navbtn[aria-current="page"]{background:var(--accent-s);color:var(--accent)}

/* ===== layout ===== */
.shell{max-width:1120px;margin:0 auto;padding:1.5rem 1rem 5rem;display:grid;grid-template-columns:220px minmax(0,1fr);gap:2rem}
.shell.solo{grid-template-columns:minmax(0,1fr);max-width:820px}
main{min-width:0}
.steps{list-style:none;margin:0;padding:0;position:sticky;top:5rem;align-self:start;display:grid;gap:.4rem}
.step{width:100%;display:grid;grid-template-columns:auto 1fr;gap:.15rem .6rem;align-items:center;text-align:left;border:2px solid transparent;background:var(--surface);border-radius:14px;padding:.55rem .7rem;cursor:pointer}
.step .num{grid-row:span 2;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--cs);color:var(--c);font-family:var(--round);font-weight:700}
.step .lbl{font-weight:700;font-size:.92rem;line-height:1.3}
.step > span:last-child{display:block;min-width:0}
.step .meter{display:block;margin:.25rem 0 .1rem;height:5px;border-radius:99px;background:var(--cs);overflow:hidden}
.step .meter i{display:block;height:100%;background:var(--c);border-radius:99px}
.step small{color:var(--muted);font-size:.75rem;line-height:1.2}
.step[aria-current="step"]{border-color:var(--c);background:var(--cs)}
.step[aria-current="step"] .num{background:var(--c);color:var(--on)}
@media (max-width:780px){
  .shell{grid-template-columns:minmax(0,1fr);gap:1rem}
  .steps{position:static;display:flex;overflow-x:auto;padding-bottom:.25rem}
  .steps li{flex:0 0 150px}
}

/* ===== form ===== */
.fields{display:grid;gap:1rem}
.field{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem 1.1rem;transition:border-color .15s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-s)}
.field > label{display:block;font-weight:700;margin-bottom:.45rem}
.labelrow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.45rem}
.labelrow label{display:block;font-weight:700;margin:0}
.field.ai .labelrow label .t{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 .1em}
.mic{display:inline-flex;align-items:center;gap:.3rem;flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:.15rem .65rem;font-size:.78rem;font-weight:700;cursor:pointer}
.mic:hover{border-color:var(--accent);color:var(--accent)}
.mic.on{background:var(--pink);border-color:var(--pink);color:var(--on)}
.opt{font-weight:500;color:var(--muted);font-size:.76rem;margin-left:.5rem;border:1px solid var(--line);border-radius:99px;padding:0 .45rem}
input[type=text],input[type=password],textarea,select{width:100%;padding:.62rem .75rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;min-height:4.5rem;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.38rem .95rem;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.field.ai{border-color:var(--marker);box-shadow:inset 5px 0 0 var(--marker)}
.field.ai > label .t{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 .1em}
.aitag{margin:.55rem 0 0;font-size:.85rem;color:var(--muted)}

/* ===== buttons ===== */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem 1.05rem;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.primary:hover{filter:brightness(1.07);color:var(--on)}
.btn.small{padding:.32rem .75rem;font-size:.85rem;border-radius:8px}
.btn.big{padding:.8rem 1.6rem;font-size:1.05rem;border-radius:12px}
.btn.danger,.link.danger{color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0}
.actions .primary{margin-left:auto}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0}
.row input[type=text],.row input[type=password]{flex:1 1 220px;width:auto}
body.is-busy [data-act]{pointer-events:none;opacity:.55}

/* ===== cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.15rem 1.25rem;margin-bottom:1.1rem}
.card h2{margin-bottom:.4rem}
.notice{border-radius:14px;background:var(--amber-s);border:1.5px solid var(--amber);padding:.9rem 1.1rem;margin-bottom:1.1rem}
.guide{counter-reset:g;list-style:none;padding:0;margin:.5rem 0}
.guide li{counter-increment:g;position:relative;padding-left:2.2rem;margin:.45rem 0}
.guide li::before{content:counter(g);position:absolute;left:0;top:.05rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.review{margin-top:1rem;border-radius:14px;border:1.5px solid var(--accent);background:var(--surface);padding:1rem 1.2rem}

/* ===== readiness ===== */
.ready{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.2rem;margin-bottom:1.1rem}
.ready .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.ready .pct{font-family:var(--round);font-weight:700;font-size:1.6rem;color:var(--accent)}
.ready .meter{height:10px;border-radius:99px;background:var(--accent-s);overflow:hidden;margin:.4rem 0 .6rem}
.ready .meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.missing{display:flex;flex-wrap:wrap;gap:.35rem}
.missing button{border:1.5px dashed var(--line);background:var(--bg);border-radius:99px;padding:.2rem .7rem;cursor:pointer;font-size:.85rem}

/* ===== mode cards ===== */
.mgroup{margin:0 0 1rem}
.mgroup h3{font-size:.95rem;margin:.2rem 0 .5rem;color:var(--muted)}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.55rem}
.mode{position:relative;display:block;border:2px solid var(--line);border-radius:14px;padding:.7rem .85rem;background:var(--surface);cursor:pointer}
.mode input{position:absolute;opacity:0;width:1px;height:1px}
.mode strong{display:block;font-family:var(--round)}
.mode small{display:block;color:var(--muted);line-height:1.5;margin-top:.15rem}
.mode.on{border-color:var(--accent);background:var(--accent-s)}
.mode:focus-within{outline:3px solid var(--accent);outline-offset:2px}

/* ===== lists ===== */
.plist{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.plist li{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--accent));border-radius:14px;padding:.25rem .8rem .25rem .3rem;flex-wrap:wrap}
.plist .open{flex:1;min-width:200px;text-align:left;background:none;border:0;padding:.6rem .7rem;cursor:pointer}
.plist .open strong{display:block;font-family:var(--round);font-size:1.05rem}
.plist .open small{color:var(--muted)}
.plist .acts{display:flex;flex-wrap:wrap;gap:.4rem;padding:.4rem 0}
.tag{display:inline-block;font-size:.72rem;border-radius:999px;padding:.05rem .55rem;margin-left:.45rem;background:var(--cs,var(--accent-s));color:var(--c,var(--accent));font-family:var(--gothic);font-weight:700;vertical-align:middle}

/* ===== login ===== */
.login{max-width:520px;margin:8vh auto 0}
.login h1{font-size:3rem;display:block;letter-spacing:.06em;line-height:1.2}
.catch{font-family:var(--round);font-weight:700;font-size:1.35rem;margin:.4rem 0 .2rem;
  background:linear-gradient(90deg,var(--orange),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.trial{border:2px dashed var(--violet);background:var(--violet-s)}
.trial .btn{border-color:var(--violet);color:var(--violet)}
.login .logo i{width:14px;height:14px}
.login .logo{gap:6px;margin-bottom:1rem}
.login .note{color:var(--muted);font-size:.85rem}
.recent{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}

/* ===== document ===== */
.docbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:1.5rem 0 .75rem;padding:.75rem .9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.docbar select{width:auto}
.docbar .meta{color:var(--muted);font-size:.84rem;flex:1 1 100%}
.doc{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:16px;padding:1.6rem 1.7rem}
.md{line-height:1.85}
.md h1{font-size:1.6rem;margin:0 0 1rem;display:block}
.md h2{font-size:1.25rem;margin:2.1rem 0 .6rem;padding:.15rem 0 .15rem .7rem;border-left:5px solid var(--accent)}
.md h3{font-size:1.04rem;margin:1.4rem 0 .4rem;color:var(--accent)}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:.75rem 0;font-size:.9rem}
.md th,.md td{border:1px solid var(--line);padding:.45rem .65rem;vertical-align:top;min-width:6em}
.md th{background:var(--accent-s);text-align:left}
.md pre{position:relative;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:2.6rem 1rem 1rem;overflow-x:auto;white-space:pre-wrap;font-size:.88rem;line-height:1.65}
.md code{font-family:var(--mono);font-size:.9em}
.md p{margin:.5rem 0}
.md ul,.md ol{padding-left:1.4rem}
.copybtn{position:absolute;top:.55rem;right:.55rem;border:0;background:var(--accent);color:var(--on);border-radius:8px;padding:.2rem .7rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--gothic)}
.empty{color:var(--muted);padding:2rem 0}

/* ===== pack editor ===== */
.tabs{display:flex;gap:.3rem;margin:0 0 1rem;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:.5rem 1rem;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pe-phase{border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:14px;background:var(--surface);padding:1rem;margin-bottom:1rem}
.pe-head{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center}
.pe-field{display:grid;grid-template-columns:1fr 150px auto;gap:.5rem;align-items:start;border-top:1px dashed var(--line);padding:.7rem 0}
.pe-field .full{grid-column:1 / -1}
.pe-tools{display:flex;gap:.25rem}
.pe-tools button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:2rem;height:2rem;cursor:pointer}
.pe-tools button:hover{border-color:var(--accent)}
.swatches{display:flex;gap:.4rem;flex-wrap:wrap}
.swatch{width:2rem;height:2rem;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
label.inline{display:inline-flex;align-items:center;gap:.35rem;font-weight:500;font-size:.88rem}
textarea.code{font-family:var(--mono);font-size:.85rem;min-height:60vh;line-height:1.5;white-space:pre;overflow:auto}
@media (max-width:600px){ .pe-field{grid-template-columns:1fr} }

/* ===== busy + toast ===== */
#busy{position:fixed;inset:0 0 auto;z-index:50;pointer-events:none}
#busy[hidden]{display:none}
#busy .rainbow{height:5px;margin-top:env(safe-area-inset-top,0px);background:linear-gradient(90deg,var(--orange),var(--teal),var(--violet),var(--blue),var(--pink),var(--orange));background-size:200% 100%;animation:flow 1.6s linear infinite}
#busy .msg{width:max-content;max-width:92vw;margin:.6rem auto 0;background:var(--ink);color:var(--bg);padding:.45rem 1rem;border-radius:999px;font-weight:700;font-size:.9rem}
@keyframes flow{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#busy .rainbow{animation:none}}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.25rem);transform:translateX(-50%);z-index:60;max-width:min(92vw,560px)}
#toast div{background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;margin-top:.5rem;font-size:.92rem}
#toast div.error{background:var(--danger);color:#fff}

/* ===== learnings ===== */
.learns{list-style:none;margin:0;padding:0}
.learns li{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;padding:.55rem 0;border-top:1px dashed var(--line)}
.learns li small{display:block;color:var(--muted);font-size:.76rem}

/* ===== diff ===== */
.diff .difflines{font-family:var(--mono);font-size:.84rem;line-height:1.6;overflow-x:auto}
.dl{white-space:pre-wrap;padding:.05rem .6rem .05rem 1.8rem;position:relative;border-radius:4px}
.dl b{position:absolute;left:.55rem;font-weight:700}
.dl.add{background:var(--green-s);color:var(--ink)} .dl.add b{color:var(--green)}
.dl.del{background:var(--pink-s);color:var(--ink);text-decoration:line-through;text-decoration-color:var(--pink)} .dl.del b{color:var(--pink)}
.dl.same{color:var(--muted)}
.dl.skip{color:var(--muted);font-style:italic;text-align:center;padding:.3rem}
.dl.inline{display:inline-block;padding:.05rem .6rem;margin-left:.5rem;text-decoration:none}
.diffsum{font-weight:700;margin:0 0 1rem}

/* ===== glossary ===== */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;border-bottom:2px dotted var(--accent)}
.term:hover{color:var(--accent)}
#termPop{position:absolute;z-index:80;max-width:min(320px,90vw);background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:.6rem .8rem;font-size:.88rem;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#termPop strong{display:block;color:var(--accent);font-family:var(--round)}

/* ===== confetti ===== */
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}

/* ===== print ===== */
@media print{
  body::before,body::after,.bar,#nav,#busy,#toast,#termPop,.copybtn{display:none !important}
  body{background:#fff;color:#000}
  body *{visibility:hidden}
  .doc,.doc *{visibility:visible}
  .doc{position:absolute;left:0;top:0;width:100%;border:0;padding:0}
  .term{border:0}
  .md h2{break-after:avoid} .md table,.md pre{break-inside:avoid}
}

</style>
</head>
<body>
<header class="bar" id="bar"></header>
<div class="shell" id="shell"><nav id="nav" aria-label="進み方"></nav><main id="main"></main></div>
<div id="busy" hidden role="status"><div class="rainbow"></div><div class="msg" id="busyText"></div></div>
<div id="toast" aria-live="polite"></div>
<noscript>このアプリはJavaScriptを有効にして使ってください。</noscript>
<script>
"use strict";
/* =========================================================
   パック(差し替え部分):質問・出力構成・AIへの指示・画面の言葉
   ========================================================= */
const HUES = ["orange","teal","violet","amber","green","blue","pink"];
const PHASE_HUES = ["orange","teal","violet","amber","green","pink"];

/* ---- アプリ設計パック:プロンプトの渡し先 ---- */
const PROMPT_TAIL = `
プロンプト本文は必ず \`\`\`text のコードブロックに入れ、プロンプトごとに別のコードブロックにする。
プロンプトは上の設計書の内容だけを根拠にし、設計書にない機能を足さない。
## 6. 予測されるつまずきポイントと対策
初心者がこのプロンプトで作らせたときに起きやすい問題を3〜6個。対象のツールで特に起きやすいものを優先する。各項目に「何が起きるか/なぜ起きるか/起きたときにAIへ送る修正指示の例」を書く。`;
const TARGETS = [
  {id:"chatgpt", name:"ChatGPT", kind:"chat"},
  {id:"claude", name:"Claude", kind:"chat"},
  {id:"gemini", name:"Gemini(チャット)", kind:"chat"},
  {id:"aistudio", name:"Google AI Studio", kind:"builder", extra:"AI機能が必要な場合は Gemini API を使うと明記する。"},
  {id:"bolt", name:"Bolt", kind:"builder"},
  {id:"lovable", name:"Lovable", kind:"builder"},
  {id:"v0", name:"v0", kind:"builder"},
  {id:"replit", name:"Replit", kind:"builder"},
  {id:"cursor", name:"Cursor", kind:"agent", rules:"Cursor のプロジェクトルール(.cursor/rules フォルダに置くルールファイル)"},
  {id:"claudecode", name:"Claude Code", kind:"agent", rules:"Claude Code が読み込む CLAUDE.md"}
];
const KIND_DESC = {
  chat:"チャットに貼るだけ。開くだけで動く1ファイルのアプリを段階的に作ります",
  builder:"アプリビルダー向け。最小版から1機能ずつ追加し、クレジットの無駄を減らします",
  agent:"パソコンで使うAIコーディングツール向け。ルールファイルと小さなタスクに分けます"
};
function targetInstructions(t){
  let body;
  if(t.kind === "chat") body = `プロンプトは ${t.name} のチャット画面に貼って使う前提にする。
ブラウザで開くだけで動く1つのHTMLファイル(HTML・CSS・JavaScriptを1ファイルにまとめる)として作らせる。サーバーが必要な機能は、まずブラウザ内の保存で代用した版にする。
「### プロンプト1(最初に渡す)」で主要画面と必須機能だけの最小版を作らせ、残りは「### プロンプト2(追加)」「### プロンプト3(追加)」…として1回に1機能ずつ渡せるように分ける。
2つ目以降のプロンプトには「変更した部分だけでなく、ファイル全体を出力してください」と必ず書く(初心者が貼り替えやすいため)。各プロンプトの最後に「完成したら確認すること」を3つ程度書く。`;
  else if(t.kind === "builder") body = `プロンプトは ${t.name} のようなAIアプリビルダーで使う前提にする。
「### プロンプト1(最初に渡す)」で画面構成と必須機能だけの最小版を作らせ、残りは「### プロンプト2(追加)」…として1回に1機能ずつ渡せるように分ける。1つのプロンプトに機能を詰め込みすぎない(やり直しによる利用枠の消費を減らすため)。
画面の見た目(配置・色・雰囲気・スマホでの表示)を具体的に書く。ログインやデータベースが必要な場合は、そのツールで一般的な方法に任せ、細かい手順は指定しすぎない。${t.extra || ""}
各プロンプトの最後に「完成したら確認すること」を3つ程度書く。`;
  else body = `プロンプトは ${t.name} のような、パソコン上のプロジェクトを直接編集するAIコーディングツールで使う前提にする。
まず「### プロジェクトのルール」として、${t.rules}に書く内容(使う技術、フォルダ構成、コードの約束事、やってはいけないこと、動作確認の方法)を1つのコードブロックで書く。
次に「### プロンプト1」「### プロンプト2」…として、実装を小さなタスクに分けて順に依頼する。各タスクに完了条件と確認方法を書き、1つ終わるごとに動作確認してから次へ進むよう指示する。`;
  return `## 5. ${t.name}用プロンプト\n${body}${PROMPT_TAIL}`;
}
const UNIVERSAL_INSTR = `## 5. AI用プロンプト(万能型)
プロンプトは、どのAIツールにもそのまま貼れる汎用の形にする。
「### プロンプト1(全体)」として、1つのプロンプトに「役割/作るもの/技術/機能/画面/データ/実装の順番/完成の条件/やってはいけないこと」を見出し付きで構造化して書く。
さらに「### プロンプト2(うまくいかないとき用)」として、AIに原因の確認と修正を頼む汎用の指示を書く。${PROMPT_TAIL}
## 7. あなたに合うAIツールの選び方
入力内容(予算、技術の希望、使う端末、規模)をもとに、初心者に合うAIツールを2〜3個提案する。チャット型(ChatGPT、Claude、Gemini)、アプリビルダー型(Google AI Studio、Bolt、Lovable、v0、Replit)、コーディングツール型(Cursor、Claude Code)の違いを一言ずつ説明したうえで、各候補に「向いている理由/注意点」を書く。無料で始められるものを優先し、料金や機能は変わることがあるので公式サイトで確認するよう一言添える。`;
const APP_REVISE = `原因ごとに「設計書の問題/プロンプトの問題/AIツール側の問題」のどれかを示す。
5章のプロンプトには、前回失敗した点を避ける具体的な指示を入れる。さらに、すでに作りかけのものがある前提で使う「### 修正用プロンプト」を5章の最後に1つ追加する。`;
const APP_MODES = [
  {id:"doc", group:"基本", label:"設計書のみ", desc:"構想・要件定義・基本設計をまとめます", instructions:"5章以降は書かない。", reviseInstructions:""},
  {id:"universal", group:"迷ったらこれ(万能型)", label:"万能型プロンプト付き", desc:"どのAIを使うか迷っている方に。どのツールにも貼れるプロンプトと、あなたに合うAIツールの案内つき", instructions:UNIVERSAL_INSTR, reviseInstructions:APP_REVISE, copy:{label:"プロンプトだけコピー", section:"5"}},
  ...TARGETS.map(t => ({id:"p_" + t.id, group:"使うツールが決まっている方(特定型)", label:t.name, desc:KIND_DESC[t.kind], instructions:targetInstructions(t), reviseInstructions:APP_REVISE, copy:{label:"プロンプトだけコピー", section:"5"}}))
];

const BUILTIN_PACKS = [
{
  id:"app-design", builtin:true, ver:3, color:"violet", name:"アプリ設計",
  description:"アプリの構想・要件定義・基本設計と、AIツール別のプロンプトを作ります。",
  docName:"設計書",
  role:"あなたは、初心者のアプリ作りを支える経験豊富なシステムエンジニアです。初心者の素朴な入力を、プロが読んでも通用する設計書に仕上げます。",

/* ---------- パックの検証と整形 ---------- */
function normalizePack(src, {keepId=false} = {}){
  const errs = [];
  const s = x => typeof x === "string" ? x.trim() : "";
  if(!src || typeof src !== "object" || Array.isArray(src)) return {pack:null, errs:["JSONのオブジェクトではありません。"]};
  const pack = {};
  pack.name = s(src.name); if(!pack.name) errs.push("name(パック名)がありません。");
  pack.description = s(src.description);
  pack.docName = s(src.docName) || "文書";
  pack.role = s(src.role) || `あなたは${pack.docName}作りに詳しい専門家です。初心者の素朴な入力を、そのまま使える${pack.docName}に仕上げます。`;
  const seen = new Set();
  const slug = (x, fb) => { let v = s(x).replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 30) || fb; while(seen.has(v)) v += "_2"; seen.add(v); return v; };
  pack.phases = [];
  const phs = Array.isArray(src.phases) ? src.phases : [];
  if(!phs.length) errs.push("phases(段階)が1つもありません。");
  phs.slice(0, 6).forEach((ph, i) => {
    const out = {id:slug(ph?.id, "p" + (i+1)), title:s(ph?.title) || `段階${i+1}`, desc:s(ph?.desc), fields:[]};
    (Array.isArray(ph?.fields) ? ph.fields : []).slice(0, 15).forEach((f, j) => {
      const type = ["text","area","single","multi"].includes(f?.type) ? f.type : "area";
      const label = s(f?.label);
      if(!label){ errs.push(`「${out.title}」の${j+1}番目の質問に label がありません。`); return; }
      const fo = {id:slug(f.id, `${out.id}_${j+1}`), type, label};
      if(s(f.ph)) fo.ph = s(f.ph);
      if(f.opt) fo.opt = true;
      if(type === "single" || type === "multi"){
        const opts = [...new Set((Array.isArray(f.opts) ? f.opts : []).map(s).filter(Boolean))].slice(0, 12);
        if(opts.length < 2){ errs.push(`「${label}」の選択肢(opts)が2つ未満です。`); return; }
        fo.opts = opts;
      }
      out.fields.push(fo);
    });
    if(out.fields.length) pack.phases.push(out);
    else errs.push(`段階「${out.title}」に使える質問がありません。`);
  });
  const all = fieldsOf(pack);
  pack.nameField = all.some(f => f.id === s(src.nameField)) ? s(src.nameField) : (all.find(f => f.type === "text")?.id || "");
  pack.requiredField = all.some(f => f.id === s(src.requiredField)) ? s(src.requiredField) : (all.find(f => f.type === "text" || f.type === "area")?.id || "");
  pack.structure = s(src.structure); if(!pack.structure) errs.push("structure(出力の構成)がありません。");
  const mids = new Set();
  pack.modes = (Array.isArray(src.modes) ? src.modes : []).slice(0, 5).map((m, i) => {
    let id = s(m?.id).replace(/[^a-zA-Z0-9_-]/g, "") || "m" + (i+1);
    while(mids.has(id)) id += "_2"; mids.add(id);
    const o = {id, group:s(m?.group), label:s(m?.label) || `出力${i+1}`, desc:s(m?.desc), instructions:s(m?.instructions), reviseInstructions:s(m?.reviseInstructions)};
    const sec = s(m?.copy?.section).replace(/[^0-9]/g, "");
    if(sec) o.copy = {label:s(m.copy.label) || "追加部分だけコピー", section:sec};
    return o;
  });
  if(!pack.modes.length) pack.modes = [{id:"doc", label:`${pack.docName}のみ`, desc:"", instructions:"", reviseInstructions:""}];
  pack.defaultMode = pack.modes.some(m => m.id === s(src.defaultMode)) ? s(src.defaultMode) : pack.modes[0].id;
  const u = src.ui || {};
  pack.ui = {
    outputStep:s(u.outputStep) || `${pack.docName}を作る`,
    outputLead:s(u.outputLead) || `これまでの回答から${pack.docName}を作ります。回答はあとから直して、何度でも作り直せます。`,
    reviseStep:s(u.reviseStep) || "うまくいかなかったら",
    reviseLead:s(u.reviseLead) || `${pack.docName}を使ってうまくいかなかったときに、原因を分析して改訂版を作ります。`,
    failLabel:s(u.failLabel) || "うまくいかなかったこと", failPh:s(u.failPh),
    reflectLabel:s(u.reflectLabel) || "もらったフィードバック・エラー(そのまま貼り付け)", reflectPh:s(u.reflectPh),
    reflectAsk:s(u.reflectAsk)
  };
  pack.color = HUES.includes(s(src.color)) ? s(src.color) : "teal";
  const tids = new Set();
  pack.templates = (Array.isArray(src.templates) ? src.templates : []).slice(0, 12).map((t, i) => {
    let id = s(t?.id).replace(/[^a-zA-Z0-9_-]/g, "") || "t" + (i+1);
    while(tids.has(id)) id += "_2"; tids.add(id);
    const ans = {}, A = (t && typeof t.answers === "object") ? t.answers : {};
    for(const f of all){
      const v = A[f.id]; if(v == null) continue;
      if(f.type === "single"){ if(f.opts.includes(v)) ans[f.id] = v; }
      else if(f.type === "multi"){ const arr = (Array.isArray(v) ? v : [v]).filter(x => f.opts.includes(x)); if(arr.length) ans[f.id] = arr; }
      else if(typeof v === "string" && v.trim()) ans[f.id] = v.trim();
    }
    return {id, name:s(t?.name) || `テンプレート${i+1}`, desc:s(t?.desc), answers:ans};
  }).filter(t => Object.keys(t.answers).length);
  pack.id = keepId && s(src.id) ? s(src.id) : "c_" + uid();
  return {pack, errs};
}

const API = "https://generativelanguage.googleapis.com/v1beta";
function apiError(status, message){
  const m = message || "";
  if(status === 400 && /api key/i.test(m)) return "APIキーが正しくありません。「設定」でキーを確認してください。";
  if(status === 401 || status === 403) return "APIキーが使えません。キーが有効か、Google AI Studioで確認してください。";
  if(status === 404) return "選んだモデルが見つかりません。「設定」で別のモデルを選んでください。";
  if(status === 429) return "利用回数の上限に達しました。少し待つか、別のモデルを選んでください。";
  if(status >= 500) return "Gemini側で一時的なエラーが起きています。少し待ってから再試行してください。";
  return `Geminiからエラーが返りました(${status}):${m.slice(0,160)}`;
}
async function gemini(system, prompt, {json=false, temperature=0.6} = {}){
  if(!settings.apiKey) throw new Error("APIキーが未登録です。「設定」で登録してください。");
  if(!settings.model) throw new Error("モデルが未選択です。「設定」で選んでください。");
  const body = { systemInstruction:{parts:[{text:system}]}, contents:[{role:"user", parts:[{text:prompt}]}], generationConfig:{temperature} };
  if(json) body.generationConfig.responseMimeType = "application/json";
  let res;
  try{
    res = await fetch(`${API}/models/${encodeURIComponent(settings.model)}:generateContent`, {
      method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":settings.apiKey}, body:JSON.stringify(body)
    });
  }catch(e){ throw new Error("Geminiに接続できませんでした。インターネット接続を確認してください。"); }
  const d = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(apiError(res.status, d?.error?.message));
  const cand = d.candidates?.[0];
  const text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
  if(!text.trim()){
    if(d.promptFeedback?.blockReason || cand?.finishReason === "SAFETY") throw new Error("安全フィルターで回答が止められました。入力の表現を変えて再試行してください。");
    throw new Error("回答が空でした。もう一度試すか、別のモデルを選んでください。");
  }
  if(cand?.finishReason === "MAX_TOKENS") toast("回答が長すぎて途中で切れた可能性があります。必要なら別のモデルで作り直してください。","error");
  return text;
}
async function fetchModels(key){
  let res;
  try{ res = await fetch(`${API}/models?pageSize=1000`, {headers:{"x-goog-api-key":key}}); }
  catch(e){ throw new Error("Geminiに接続できませんでした。インターネット接続を確認してください。"); }
  const d = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(apiError(res.status, d?.error?.message));
  return (d.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map(m => ({id:m.name.replace(/^models\//,""), label:m.displayName || m.name}))
    .filter(m => /gemini/i.test(m.id) && !/(embedding|image|tts|audio|live|robotics|computer-use)/i.test(m.id))
    .sort((a,b) => b.id.localeCompare(a.id));
}

async function doComplete(pid){
  const p = proj(), ph = p.pack.phases.find(x => x.id === pid);
  const blanks = ph.fields.filter(f => isBlank(p.answers[f.id]));
  if(!blanks.length){ toast("この段階に空欄はありません。"); return; }
  const list = blanks.map(f => `- id: ${f.id} / 項目: ${f.label} / 形式: ${f.type === "single" ? "1つ選ぶ" : f.type === "multi" ? "複数選ぶ(配列)" : "文章"}${f.opts ? ` / 選択肢: ${JSON.stringify(f.opts)}` : ""}`).join("\n");
  const sys = `${p.pack.role}
いまは、初心者の回答をもとに、未回答の項目に入れる提案を作ります。回答済みの内容と矛盾しないこと。初心者が読んで分かる平易な日本語で、短く具体的に書くこと。
出力はJSONオブジェクトのみ。キーは項目のid、値は提案。「1つ選ぶ」は選択肢の文字列をそのまま1つ、「複数選ぶ」は選択肢の文字列の配列、「文章」は文字列。`;
  const text = await withBusy("空欄の提案を考えています…", () => gemini(sys, `これまでの回答:\n${answersText(p)}\n\n提案してほしい項目:\n${list}`, {json:true}));
  if(text == null) return;
  let obj;
  try{ obj = JSON.parse(text.replace(/```json|```/g, "").trim()); }
  catch(e){ toast("AIの回答を読み取れませんでした。もう一度試してください。","error"); return; }
  let n = 0;
  p.aiFilled = p.aiFilled || {};
  for(const f of blanks){
    let v = obj[f.id];
    if(v == null) continue;
    if(f.type === "single"){ if(!f.opts.includes(v)) continue; }
    else if(f.type === "multi"){ v = (Array.isArray(v) ? v : [v]).filter(x => f.opts.includes(x)); if(!v.length) continue; }
    else { v = String(v).trim(); if(!v) continue; }
    p.answers[f.id] = v; p.aiFilled[f.id] = true; n++;
  }
  touch(p); save(); render();
  toast(n ? `${n}個の項目にAIの提案を入れました。蛍光ペンの項目を確認してください。` : "提案できる項目がありませんでした。");
}
async function doReview(pid){
  const p = proj(), ph = p.pack.phases.find(x => x.id === pid);
  const sys = `${p.pack.role}
いまは、初心者が書いた「${ph.title}」の内容を確認し、矛盾・漏れ・あいまいな点を指摘するレビュアーです。
Markdownで、次の3つの見出しで書く。前置きは不要。
### 良い点(1〜2個)
### 直したほうがよい点(最大5個。それぞれ理由と具体的な直し方)
### 決めておくべき質問(最大3個)
初心者にも分かる平易な日本語で、短く書く。`;
  const text = await withBusy("レビューしています…", () => gemini(sys, `全体の回答(参考):\n${answersText(p)}\n\nレビュー対象:「${ph.title}」`));
  if(text == null) return;
  p.reviews = p.reviews || {}; p.reviews[pid] = cleanMd(text);
  touch(p); save(); render();
  setTimeout(() => $(".review")?.scrollIntoView({behavior:"smooth", block:"start"}), 50);
}
function cleanMd(t){
  const s = t.trim();
  const m = s.match(/^```(?:markdown|md)?\s*\n([\s\S]*)\n```$/);
  return m ? m[1].trim() : s;
}
function extractSection(text, section){
  const m = text.match(new RegExp(`^##\\s*${section}[\\.\\s．].*$`, "m"));
  if(!m) return "";
  const rest = text.slice(m.index + m[0].length);
  const end = rest.search(/^##\s/m);
  return (end >= 0 ? rest.slice(0, end) : rest).trim();
}
function addVersion(p, v){
  v.v = p.versions.length ? Math.max(...p.versions.map(x => x.v)) + 1 : 1;
  v.at = new Date().toISOString(); v.model = settings.model;
  p.versions.push(v); p.viewV = v.v; p.diffWith = null; touch(p); save(); go("output");
  setTimeout(() => $(".docbar")?.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  confetti();
  toast(`v${v.v}を作りました`);
}
async function doGenerate(){
  const p = proj(), pack = p.pack, req = fieldsOf(pack).find(f => f.id === pack.requiredField);
  if(req && isBlank(p.answers[req.id])){
    toast(`「${req.label}」を入力してください。`,"error");
    go("phase:" + pack.phases.find(ph => ph.fields.includes(req)).id); return;
  }
  const mode = modeOf(pack, p.modeId);
  const text = await withBusy(`${pack.docName}を作っています…(1分ほどかかることがあります)`, () => gemini(sysGenerate(pack, mode, learnText(pack.id)), `以下は初心者が入力した内容です。これをもとに${pack.docName}を作ってください。\n\n${answersText(p)}`));
  if(text == null) return;
  addVersion(p, {kind:"new", modeId:mode.id, md:cleanMd(text)});
}
async function doRevise(){
  const p = proj(), d = p.draft || {}, pack = p.pack;
  const base = p.versions.find(x => x.v === Number(d.base)) || p.versions[p.versions.length - 1];
  if(!base){ toast(`先に${pack.docName}を作ってください。`,"error"); return; }
  if(isBlank(d.fail) && isBlank(d.reflect)){ toast("うまくいかなかったことか、フィードバックのどちらかを入力してください。","error"); return; }
  const n = Math.max(...p.versions.map(x => x.v)) + 1;
  const mode = modeOf(pack, base.modeId);
  const prompt = `## 前回の${pack.docName}(v${base.v})\n${base.md}\n\n## ユーザーが入力した「${pack.ui.failLabel}」\n${fmtVal(d.fail)}\n\n## ${pack.ui.reflectLabel}\n${fmtVal(d.reflect)}\n\n## 参考:最初の入力内容\n${answersText(p)}`;
  const text = await withBusy("原因を分析して、改訂版を作っています…", () => gemini(sysRevise(pack, mode, n, learnText(pack.id)), prompt));
  if(text == null) return;
  const fail = d.fail || "", reflect = d.reflect || "";
  p.draft = {fail:"", reflect:"", base:null};
  const got = harvestLearnings(p, cleanMd(text));
  if(got) setTimeout(() => toast(`学びメモに${got}件を追加しました。次から自動で反映されます。`), 900);
  addVersion(p, {kind:"revise", base:base.v, modeId:mode.id, md:cleanMd(text), fail, reflect});
}
async function doAiPack(){
  const idea = $("#packIdea").value.trim();
  if(!idea){ toast("どんなツールにしたいかを入力してください。","error"); return; }
  const text = await withBusy("パックを作っています…", () => gemini(SYS_PACK, `作りたいツール:\n${idea}`, {json:true, temperature:0.7}));
  if(text == null) return;
  let obj;
  try{ obj = JSON.parse(text.replace(/```json|```/g, "").trim()); }
  catch(e){ toast("AIの回答を読み取れませんでした。もう一度試してください。","error"); return; }
  const {pack, errs} = normalizePack(obj);
  if(!pack || !pack.name || !pack.structure || !pack.phases.length){ toast("使えるパックになりませんでした。説明を具体的にして、もう一度試してください。","error"); return; }

  toast(errs.length ? `「${pack.name}」を作りました(${errs.length}か所を自動で直しました)` : `「${pack.name}」を作りました`);
  go("packs");
}

/* ---------- データの読み込みと移行 ---------- */
const mapMode = id => id === "aistudio" ? "p_aistudio" : id;
function migrate(d){
  d.packs = Array.isArray(d.packs) ? d.packs : [];
  d.learnings = Array.isArray(d.learnings) ? d.learnings : [];
  for(const pk of d.packs) pk.color = HUES.includes(pk.color) ? pk.color : "teal";
  for(const p of d.projects){
    if(!p.pack){
      // パック導入前のデータ
      p.modeId = p.outMode === "doc" ? "doc" : (p.ptype === "aistudio" ? "aistudio" : "universal");
      for(const v of p.versions || []) v.modeId = v.mode === "doc" ? "doc" : (v.ptype === "aistudio" ? "aistudio" : "universal");
      p.pack = {id:"app-design", ver:1};
    }
    const b = BUILTIN_PACKS.find(x => x.id === p.pack.id);
    if(b && (p.pack.ver || 1) < b.ver){
      // 組み込みパックの新しい版に更新(質問のidは同じなので回答はそのまま使える)
      const fresh = clone(b); delete fresh.builtin; p.pack = fresh;
      p.modeId = mapMode(p.modeId);
      for(const v of p.versions || []) v.modeId = mapMode(v.modeId);
    }
    p.pack.color = HUES.includes(p.pack.color) ? p.pack.color : "teal";
    p.updated = p.updated || p.created || new Date().toISOString();
    p.versions = p.versions || []; p.answers = p.answers || {}; p.aiFilled = p.aiFilled || {}; p.reviews = p.reviews || {};
  }
  return d;
}
function login(name){
  name = String(name || "").trim().slice(0, 40);
  if(!name){ toast("ユーザー名を入力してください。","error"); return; }
  user = name;
  const k = keyOf(name);
  const existing = LS.get(k.data);
  data = migrate(existing && Array.isArray(existing.projects) ? existing : {projects:[], currentId:null, packs:[], learnings:[]});
  settings = LS.get(k.settings) || {};
  const users = (LS.get("sdg.users") || []).filter(u => u !== name); users.unshift(name);
  LS.set("sdg.users", users.slice(0, 8)); LS.set("sdg.lastUser", name);
  save(); go("projects");
  toast(existing ? `${name}さんのデータを読み込みました` : `${name}さんとして始めます`);
}

  const now = new Date().toISOString();

/* ---------- 版の差分 ---------- */
function lineDiff(a, b){
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  if(n * m > 600000) return null;
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i = 0, j = 0;
  while(i < n && j < m){
    if(A[i] === B[j]){ out.push([" ", A[i]]); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) out.push(["-", A[i++]]);
    else out.push(["+", B[j++]]);
  }
  while(i < n) out.push(["-", A[i++]]);
  while(j < m) out.push(["+", B[j++]]);
  return out;
}
function diffHTML(oldV, newV){
  const d = lineDiff(oldV.md, newV.md);
  if(!d) return `<p class="empty">文書が長すぎるため、差分を表示できません。</p>`;
  const add = d.filter(x => x[0] === "+").length, del = d.filter(x => x[0] === "-").length;
  let html = "", run = [];
  const flush = () => {
    if(run.length > 6){
      html += run.slice(0, 2).map(l => `<div class="dl same">${esc(l) || "&nbsp;"}</div>`).join("");
      html += `<div class="dl skip">… 変更のない ${run.length - 4} 行 …</div>`;
      html += run.slice(-2).map(l => `<div class="dl same">${esc(l) || "&nbsp;"}</div>`).join("");
    } else html += run.map(l => `<div class="dl same">${esc(l) || "&nbsp;"}</div>`).join("");
    run = [];
  };
  for(const [k, l] of d){
    if(k === " "){ run.push(l); continue; }
    flush();
    html += `<div class="dl ${k === "+" ? "add" : "del"}"><b aria-hidden="true">${k}</b>${esc(l) || "&nbsp;"}</div>`;
  }
  flush();
  return `<article class="doc diff">
    <p class="diffsum">v${oldV.v} → v${newV.v}:<span class="dl add inline">追加 ${add}行</span><span class="dl del inline">削除 ${del}行</span></p>
    <div class="difflines">${html}</div></article>`;
}

/* ---------- 用語のミニ解説 ---------- */
const GLOSSARY = {
  "要件定義":"作るものが「何をできる必要があるか」を決める工程です。",
  "基本設計":"画面・機能・データなど、作り方の骨組みを決める工程です。",
  "非機能要件":"機能以外に求める条件です。速さ、安全性、対応端末、費用など。",
  "機能要件":"アプリが「できること」の一覧です。",
  "ユーザーストーリー":"「誰が、何をしたいか、なぜか」を一文で書く、要件の書き方です。",
  "画面遷移":"どの画面から、どの画面へ移動するかの流れです。",
  "スコープ":"今回やる範囲と、やらない範囲のことです。",
  "未確定事項":"まだ決まっておらず、あとで決める必要があることです。",
  "プロンプト":"AIに送る指示文のことです。",
  "APIキー":"APIを使うための合言葉のような文字列です。他人に教えないでください。",
  "API":"アプリどうしがやり取りするための窓口です。",
  "データベース":"データを整理して保存しておく場所です。",
  "IndexedDB":"ブラウザの中に、写真などの大きめのデータも保存できる仕組みです。",
  "React":"画面を部品の組み合わせで作るための、よく使われる道具(ライブラリ)です。",
  "Firebase":"Googleの、ログインやデータ保存などをまとめて使えるサービスです。",
  "Supabase":"ログインやデータベースをまとめて使えるサービスです。",
  "MVP":"まず動く、最小限の版のことです。",
  "KPI":"目標の達成度を測るための数値です。",
  "ワイヤーフレーム":"画面の配置を線で描いた、簡単な設計図です。",
  "クラウド":"インターネット上のサーバーにデータを置く仕組みです。どの端末からも使えます。",
  "認証":"ログインなどで「本人かどうか」を確かめる仕組みです。"
};
const TERM_RE = new RegExp(Object.keys(GLOSSARY).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
function decorateTerms(){
  const roots = document.querySelectorAll("#main .md, #main .lead");
  roots.forEach(root => {
    const used = new Set();
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n =>
      n.parentElement.closest("pre,code,button,a,input,textarea,select,.term,h1") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
    for(const node of nodes){
      const text = node.nodeValue; let m, last = 0, frag = null;
      TERM_RE.lastIndex = 0;
      while((m = TERM_RE.exec(text))){
        if(used.has(m[0])) continue;
        used.add(m[0]);
        frag = frag || document.createDocumentFragment();
        frag.append(text.slice(last, m.index));
        const b = document.createElement("button");
        b.type = "button"; b.className = "term"; b.dataset.term = m[0]; b.textContent = m[0];
        b.setAttribute("aria-label", `${m[0]}(用語の説明を見る)`);
        frag.append(b); last = m.index + m[0].length;
      }
      if(frag){ frag.append(text.slice(last)); node.replaceWith(frag); }
    }
  });
}
function closeTerm(){ $("#termPop")?.remove(); }
function showTerm(btn){
  closeTerm();
  const pop = document.createElement("div");
  pop.id = "termPop"; pop.setAttribute("role", "tooltip");
  pop.innerHTML = `<strong>${esc(btn.dataset.term)}</strong>${esc(GLOSSARY[btn.dataset.term] || "")}`;
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + window.scrollX)) + "px";
  pop.style.top = (r.bottom + window.scrollY + 6) + "px";
}
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if(t){ e.preventDefault(); $("#termPop") && $("#termPop").dataset.for === t.dataset.term ? closeTerm() : (showTerm(t), $("#termPop").dataset.for = t.dataset.term); return; }
  if(!e.target.closest("#termPop")) closeTerm();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeTerm(); });

/* ---------- 完成の演出(紙吹雪) ---------- */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--orange","--teal","--violet","--blue","--pink","--amber"].map(v => cs.getPropertyValue(v).trim() || "#2C74D6");
  const cv = document.createElement("canvas");
  cv.className = "confetti"; cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d"); ctx.scale(devicePixelRatio, devicePixelRatio);
  const ps = Array.from({length:140}, () => ({
    x:innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y:innerHeight * .35,
    vx:(Math.random() - .5) * 14, vy:-Math.random() * 13 - 4, s:5 + Math.random() * 6,
    r:Math.random() * Math.PI, vr:(Math.random() - .5) * .3, c:colors[Math.floor(Math.random() * colors.length)], round:Math.random() < .35
  }));
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = Math.max(0, 1 - el / 2200);
    for(const p of ps){
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if(el < 2200) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

render();
